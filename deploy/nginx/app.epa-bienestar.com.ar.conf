# /etc/nginx/sites-available/app.epa-bienestar.com.ar
# Producción: sirve el build estático de Vite (dist/) en lugar del dev server (:5173)

# --- HTTP -> HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name app.epa-bienestar.com.ar;

    if ($host = app.epa-bienestar.com.ar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}

# --- HTTPS: SPA estática ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.epa-bienestar.com.ar;

    ssl_certificate /etc/letsencrypt/live/app.epa-bienestar.com.ar/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.epa-bienestar.com.ar/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Carpeta generada por `npm run build` (ajustar a la ruta real)
    root  /var/www/app.epa-bienestar.com.ar/dist;
    index index.html;

    access_log /var/log/nginx/app.epa-bienestar.access.log;
    error_log  /var/log/nginx/app.epa-bienestar.error.log;

    # Cabeceras de seguridad (se heredan porque las locations usan `expires`, no `add_header`)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/fhir+json application/manifest+json image/svg+xml;

    # Assets con hash de Vite: caché larga
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html nunca se cachea (para que los deploys se vean al instante)
    location = /index.html {
        expires -1;
    }

    # Otros archivos estáticos de /public
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|webmanifest)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Bloquear archivos ocultos (.env, .git, etc.), excepto ACME de Certbot
    location ~ /\.(?!well-known) {
        deny all;
    }

    # SPA fallback: rutas del router del cliente -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
